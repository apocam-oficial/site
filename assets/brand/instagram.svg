<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
  <!--
    Marca do Instagram no degrade oficial, servida do proprio dominio.
    Arquivo em vez de data URI de proposito: a CSP do site publica
