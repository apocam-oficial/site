  -->
  <defs>
    <radialGradient id="ig" cx="0.3" cy="1.07" r="1.15">
      <stop offset="0" stop-color="#FDF497"/>
      <stop offset="0.05" stop-color="#FDF497"/>
      <stop offset="0.45" stop-color="#FD5949"/>
      <stop offset="0.6" stop-color="#D6249F"/>
      <stop offset="0.9" stop-color="#285AEB"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="url(#ig)" stroke-width="2.1">
    <rect x="2.65" y="2.65" width="18.7" height="18.7" rx="5.6"/>
    <circle cx="12" cy="12" r="4.3"/>
  </g>
  <circle cx="17.25" cy="6.75" r="1.35" fill="url(#ig)"/>
